name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # `pnpm install` dispara el postinstall (`prisma generate`), que carga
      # prisma.config.ts y exige DIRECT_URL. NO se conecta a la base: solo
      # necesita una URL con forma válida para poder parsear la config.
      DIRECT_URL: postgresql://user:pass@localhost:5432/db

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test